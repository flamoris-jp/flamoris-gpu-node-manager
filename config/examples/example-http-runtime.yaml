# Illustrative only; verify service and ownership matchers before enabling.
id: example-http-runtime
display_name: Example HTTP runtime
service: example-http-runtime.service
resource_class: gpu-heavy
enabled: false
health:
  type: http
  url: http://127.0.0.1:9001/health
release:
  type: process
  processes:
  - name: example-server
    cmdline_contains:
    - /opt/example/http/server
timeouts:
  stop_seconds: 30
  release_seconds: 60
  start_seconds: 60
  health_seconds: 60
