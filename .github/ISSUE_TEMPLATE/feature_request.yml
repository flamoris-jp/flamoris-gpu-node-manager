name: Feature request
description: Propose a new capability or improvement.
title: "[Feature] "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem or limitation should this change address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: Describe the desired behavior or outcome. Implementation details are optional.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Scope and boundaries
      description: What belongs in this repository, and what should remain outside it?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds or other approaches if relevant.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, sketches, examples, or related FLAMORIS repositories if useful.
